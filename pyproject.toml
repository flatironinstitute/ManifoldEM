[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ManifoldEM"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Ali Dashti"},
    {name = "Joachim Frank"},
    {name = "Hstau Liao"},
    {name = "Suvrajit Maji"},
    {name = "Ghoncheh Mashayekhi"},
    {name = "Abbas Ourmazd"},
    {name = "Peter Schwander"},
    {name = "Evan Seitz", email = "evan.e.seitz@gmail.com"},
    {name = "Robert Blackwell", email = "rblackwell@flatironinstitute.org"},
]
maintainers = [
    {name = "Robert Blackwell", email = "rblackwell@flatironinstitute.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "fasthog",
    "h5py",
    "imageio",
    "nptyping",
    "numba",
    # nptyping 2.5.0 (latest) imports np.bool8, removed in numpy 2.0:
    "numpy<2",
    "mrcfile",
    "opencv-python-headless",
    "opencv-contrib-python",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "toml",
    "tqdm",
]

[project.optional-dependencies]
# RECOMMENDED: install the 3D stack (mayavi + vtk + pyqt) from conda-forge as a
# matched binary set -- see the "conda" install section in README.md. The pip
# route below is a best-effort fallback for non-conda environments.
#
# The failure mode this guards against: mayavi and vtk must come from the *same*
# build. A mismatch (e.g. tvtk wrappers built against an older vtk, then run
# against vtk >= 9.5) surfaces at render time as an undefined 'copy_global_ids'
# trait on vtkPointData. conda-forge's mayavi 4.8.3 + vtk 9.4.x is a known-good
# pair; vtk 9.5/9.6 are not. When installing via pip, also pass
# --no-build-isolation so mayavi's tvtk generator wraps the vtk in your env
# rather than pulling the newest vtk into an isolated build overlay.
gui = [
    "configobj",
    "fabric",
    "matplotlib",
    "mayavi@https://github.com/enthought/mayavi/zipball/main",
    "PyQt5",
    "vtk<9.5",
]

[project.scripts]
manifold-cli = "ManifoldEM.interfaces.cli:main"
manifold-gui = "ManifoldEM.interfaces.gui:main"

[project.urls]
Repository = "https://github.com/flatironinstitute/ManifoldEM.git"

# Must declare to have version automation, even if empty
[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["ManifoldEM*"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 119

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
filterwarnings = 'ignore:.*is a deprecated alias for `np'
